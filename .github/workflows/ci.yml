name: CI

# Builds PostgreSQL 17, 18 and 19 with the patch series from patches/ and
# runs all tests for each: the PostgreSQL regression suite, the hooks test
# module, both extensions and the test with the two extensions together.
# On 18 and 19 everything but the regression suite runs once for each
# io_method (sync, worker, io_uring).

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build and test (PostgreSQL ${{ matrix.pg }} + hooks)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        pg: ['17', '18', '19']

    env:
      PG_VERSION: ${{ matrix.pg }}
      # Fail instead of silently skipping io_method = io_uring.
      LIBURING: ${{ matrix.pg == '17' && 'no' || 'yes' }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: scripts/install-deps-debian.sh

      - name: Build PostgreSQL with the patches
        run: scripts/build-postgres.sh

      - name: Run the tests
        run: scripts/run-tests.sh

      - name: Collect logs
        if: failure()
        run: |
          mkdir -p ci-logs
          find build extensions tests \
            \( -name regression.diffs -o -name regression.out \
               -o -path '*/tmp_check/log/*' -o -name make.log -o -name configure.log \) \
            -type f -print0 | xargs -0 -I{} cp --parents {} ci-logs/ || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-pg${{ matrix.pg }}
          path: ci-logs
          if-no-files-found: ignore
