name: CI

# Builds PostgreSQL 17, 18 and 19 with the patch series from patches/ and
# runs all tests for each: the PostgreSQL regression suite, the hooks test
# module, both extensions and the test with the two extensions together.
# On 18 and 19 everything but the regression suite runs once for each
# io_method (sync, worker, io_uring).  The code style is checked too.
# A separate job tests pg_upgrade of an encrypted cluster from 17 and 18
# to 19.

on:
  # Branches other than main are tested through their pull requests, so
  # that a push to such a branch does not run the same tests twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (PostgreSQL ${{ matrix.pg }} + hooks)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        pg: ['17', '18', '19']

    env:
      PG_VERSION: ${{ matrix.pg }}
      # Fail instead of silently skipping io_method = io_uring.
      LIBURING: ${{ matrix.pg == '17' && 'no' || 'yes' }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: scripts/install-deps-debian.sh

      - name: Build PostgreSQL with the patches
        run: scripts/build-postgres.sh

      - name: Run the tests
        run: scripts/run-tests.sh

      # Also after failed tests, so that one does not hide the other.
      - name: Check the code style
        if: ${{ !cancelled() }}
        run: scripts/check-style.sh

      - name: Collect logs
        if: failure()
        run: |
          mkdir -p ci-logs
          find build extensions tests \
            \( -name regression.diffs -o -name regression.out \
               -o -path '*/tmp_check/log/*' -o -name make.log -o -name configure.log \) \
            -type f -print0 | xargs -0 -I{} cp --parents {} ci-logs/ || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-pg${{ matrix.pg }}
          path: ci-logs
          if-no-files-found: ignore

  upgrade:
    name: pg_upgrade (PostgreSQL ${{ matrix.old }} to 19)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        old: ['17', '18']

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: scripts/install-deps-debian.sh

      - name: Build PostgreSQL ${{ matrix.old }} with the patches
        run: PG_VERSION=${{ matrix.old }} scripts/build-postgres.sh

      - name: Build PostgreSQL 19 with the patches
        run: PG_VERSION=19 scripts/build-postgres.sh

      - name: Run the upgrade test
        run: OLD_VERSION=${{ matrix.old }} NEW_VERSION=19 scripts/run-upgrade-test.sh

      - name: Collect logs
        if: failure()
        run: |
          mkdir -p ci-logs
          find build tests \
            \( -path '*/tmp_check/log/*' -o -name make.log -o -name configure.log \
               -o -name '*.txt' -path '*pg_upgrade_output.d*' \) \
            -type f -print0 | xargs -0 -I{} cp --parents {} ci-logs/ || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-upgrade-pg${{ matrix.old }}
          path: ci-logs
          if-no-files-found: ignore
